<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review Steel sign-in request</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="approval">
    <header>
      <h1>Review sign-in request</h1>
      <a href="options.html">Settings</a>
    </header>
    <p id="countdown" role="timer"></p>
    <section id="review" aria-live="polite">Loading request…</section>
    <section>
      <p>
        Approval transfers only this site's cookies and parent-host cookies into the named profile.
        localStorage needs an open tab at this site's exact origin.
      </p>
      <button id="inspect" type="button" disabled>Inspect sign-in names</button>
      <label class="check"
        ><input id="remember" type="checkbox" />Always allow this site for this profile for 7
        days</label
      >
      <button id="approve" type="button" class="primary" disabled>Approve sign-in transfer</button>
      <label for="note">Optional operator note</label
      ><input id="note" maxlength="1000" autocomplete="off" />
      <button id="deny" type="button" disabled>Deny</button>
      <p id="status" class="notice" role="status"></p>
    </section>
    <script type="module" src="approval.js"></script>
  </body>
</html>
